{% assign tab_label = include.label | strip %}
{% if tab_label != '' %}
<section class="tab-item">
  <h3 class="tab-item-label">{{ include.label | escape }}</h3>
  <div class="tab-panel sl-markdown-content">{% if include.content %}{{ include.content | markdownify }}{% endif %}</div>
</section>
{% endif %}
