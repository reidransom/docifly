<!doctype html>
<html lang="{{ site.lang | default: 'en' | escape }}" data-theme="dark" data-layout="splash">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
    <script src="{{ '/assets/color-mode.js' | relative_url | escape }}"></script>
    <link rel="stylesheet" href="{{ '/assets/starlyt.css' | relative_url | escape }}">
    <script src="{{ '/assets/prose.js' | relative_url | escape }}" defer></script>
    <script src="{{ '/assets/flexsearch-0.8.212.min.js' | relative_url | escape }}" defer></script>
    <script src="{{ '/assets/search.js' | relative_url | escape }}" defer></script>
    <script src="{{ '/assets/tabs.js' | relative_url | escape }}" defer></script>
    <script src="{{ '/assets/code.js' | relative_url | escape }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">{% include header.html %}</header>
    <div class="splash-frame">
      <main id="main-content" class="main-pane splash-pane" tabindex="-1">
        {% if page.hero %}
          <div class="content-panel"><div class="content-container">{% include hero.html %}</div></div>
        {% else %}
          <div class="content-panel"><div class="content-container"><h1 id="page-title">{{ page.title | escape }}</h1></div></div>
        {% endif %}
        <div class="content-panel"><div class="content-container"><article id="article" class="sl-markdown-content">{{ content }}</article></div></div>
      </main>
    </div>
  </body>
</html>
